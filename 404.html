<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- This file is what turns off Cloudflare Pages' single-page-application mode:
       without a top-level 404.html, any unknown path answers 200 with the home page. -->
  <title>Page not found - Tools</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- styles are inline on purpose: the error page should not depend on a CDN -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px; background-color: #121212; color: #f8f9fa;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
    }
    .card {
      background-color: #1e1e1e; border: 1px solid #2c2c2c; border-radius: 14px;
      padding: 44px 40px; max-width: 440px; text-align: center;
    }
    .icon { font-size: 40px; }
    .code { margin: 14px 0 0; font-size: 40px; font-weight: 700; letter-spacing: -1px; }
    h1 { margin: 4px 0 0; font-size: 19px; font-weight: 600; }
    p.text { margin: 12px 0 0; color: #b9bec4; font-size: 15px; }
    a.btn {
      display: inline-block; margin-top: 26px; padding: 11px 22px; border-radius: 10px;
      background: #0d6efd; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
    }
    a.btn:hover { background: #0b5ed7; }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">&#128736;&#65039;</div>
    <p class="code">404</p>
    <h1>This page does not exist</h1>
    <p class="text">Tools is a single page: the list itself.</p>
    <a class="btn" href="/">Back to the tools</a>
  </main>
</body>

</html>
